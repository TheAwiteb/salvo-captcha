[workspace]
members = [".", "examples/example-login"]
default-members = ["."]

[package]
name = "salvo-captcha"
version = "0.4.0"
edition = "2021"
authors = ["Awiteb <a@4rs.nl>"]
description = "A captcha middleware for Salvo framework."
license = "MIT"
repository = "https://git.4rs.nl/awiteb/salvo-captcha.git"
documentation = "https://docs.rs/salvo-captcha"
readme = "README.md"
keywords = ["salvo", "captcha", "middleware"]
categories = ["web-programming", "network-programming"]


[dependencies]
salvo_core = { version = ">= 0.65, <= 0.79", default-features = false }
log = "0.4"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", default-features = false }
cacache = { version = "13", default-features = false, features = [
  "tokio-runtime",
  "mmap",
], optional = true }
captcha = { version = "1", default-features = false, optional = true }
either = { version = "1", default-features = false }

[features]
cacache-storage = ["dep:cacache"]
simple-generator = ["dep:captcha"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
tempfile = "3.9"
rstest = "0.22.0"
